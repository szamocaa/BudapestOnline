[/Script/EngineSettings.GameMapsSettings]
; Every level uses the Budapest game mode, so any level (even an empty one) becomes the simulation.
GlobalDefaultGameMode=/Script/BudapestSim.BudapestGameMode

[/Script/Engine.RendererSettings]
; Same realistic defaults as Epic's UE5 templates: Lumen global illumination and reflections, virtual shadow maps.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True

[/Script/Engine.CollisionProfile]
; ECC_GameTraceChannel1 = "Building" (see Source/BudapestSim/Game/BudapestCollision.h)
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Block,bTraceType=False,bStaticObject=False,Name="Building")
